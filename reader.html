<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DEJAVU — Dergi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --cream: #f8eee9;
      --cream-2: #fff8f5;
      --pink: #eaa2b1;
      --pink-strong: #d96f88;
      --coral: #ee9a83;
      --lavender: #b9a5d8;
      --wine: #482634;
      --dark: #292329;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--dark);
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(248, 238, 233, 0.92);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(72, 38, 52, 0.08);
    }

    .reader-header {
      width: min(1250px, calc(100% - 30px));
      min-height: 70px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
      min-width: 0;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;

      color: var(--wine);

      white-space: nowrap;
    }

    .back-button:hover {
      color: var(--pink-strong);
    }

    .issue-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 27px;
      font-weight: 600;
      color: var(--wine);
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .control-button {
      border: 1px solid rgba(72, 38, 52, 0.12);
      background: rgba(255,255,255,0.5);

      color: var(--wine);

      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      font-size: 15px;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .control-button:hover {
      background: var(--pink);
      transform: translateY(-1px);
    }

    .control-button.active {
      background: var(--wine);
      color: white;
    }

    /* NAVIGATION */

    .page-navigation {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;

      z-index: 900;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;

      pointer-events: none;
    }

    .nav-arrow {
      width: 45px;
      height: 45px;

      border: 1px solid rgba(72, 38, 52, 0.1);
      border-radius: 50%;

      background: rgba(255,255,255,0.88);

      color: var(--wine);

      cursor: pointer;

      font-size: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 8px 25px rgba(72, 38, 52, 0.1);

      pointer-events: auto;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-arrow:hover {
      background: var(--pink);
      transform: translateY(-2px);
    }

    .page-counter {
      min-width: 90px;

      padding: 10px 15px;

      border-radius: 999px;

      background: rgba(255,255,255,0.88);

      color: var(--wine);

      font-size: 11px;
      font-weight: 600;

      text-align: center;

      box-shadow: 0 8px 25px rgba(72, 38, 52, 0.1);

      pointer-events: auto;
    }

    /* VIEWER */

    #viewer {
      width: 100%;
      min-height: calc(100vh - 70px);

      padding: 35px 25px 100px;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      gap: 25px;
    }

    #viewer.spread {
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    #viewer.strip {
      flex-direction: column;
      align-items: center;
    }

    .page {
      flex: 0 0 auto;

      background: white;

      box-shadow:
        0 15px 45px rgba(72, 38, 52, 0.14);

      border-radius: 2px;

      overflow: hidden;

      transition: opacity 0.2s ease;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* SPREAD MODE */

    #viewer.spread .page {
      width: min(
        calc((100vw - 100px) / 2),
        550px
      );
    }

    /* STRIP MODE */

    #viewer.strip .page {
      width: min(
        calc(100vw - 50px),
        850px
      );

      margin-bottom: 25px;
    }

    #viewer.spread .page:not(.visible) {
      display: none;
    }

    /* LOADING */

    .loading {
      width: 100%;
      min-height: 50vh;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 15px;

      color: var(--wine);

      text-align: center;
    }

    .loading-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 32px;
    }

    .loading-text {
      font-size: 12px;
      opacity: 0.55;
    }

    .error {
      width: min(600px, calc(100% - 40px));
      margin: 100px auto;

      padding: 35px;

      background: rgba(255,255,255,0.7);

      border: 1px solid rgba(72, 38, 52, 0.08);

      border-radius: 25px;

      text-align: center;

      color: var(--wine);
    }

    .error h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 35px;
      margin-bottom: 15px;
    }

    .error p {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.7;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .reader-header {
        min-height: 62px;
      }

      .back-button {
        font-size: 8px;
      }

      .issue-name {
        font-size: 22px;
      }

      .controls {
        gap: 4px;
      }

      .control-button {
        width: 32px;
        height: 32px;
        font-size: 12px;
      }

      #viewer {
        padding: 20px 10px 90px;
      }

      #viewer.spread .page {
        width: calc(100vw - 35px);
      }

      #viewer.spread {
        overflow-x: hidden;
      }

      #viewer.spread .page:not(.visible) {
        display: none;
      }

      #viewer.strip .page {
        width: calc(100vw - 25px);
      }

      .page-navigation {
        bottom: 12px;
      }

      .nav-arrow {
        width: 40px;
        height: 40px;
      }

      .page-counter {
        min-width: 75px;
        font-size: 10px;
      }
    }

  </style>
</head>

<body>


  <!-- HEADER -->

  <header>

    <div class="reader-header">

      <div class="header-left">

        <a
          href="index.html"
          class="back-button"
        >
          ← DEJAVU
        </a>

        <div
          class="issue-name"
          id="issueName"
        >
          DEJAVU
        </div>

      </div>


      <div class="controls">

        <button
          class="control-button active"
          id="spreadButton"
          title="Yan yana"
          type="button"
        >
          ▯▯
        </button>

        <button
          class="control-button"
          id="stripButton"
          title="Şerit"
          type="button"
        >
          ☰
        </button>

        <button
          class="control-button"
          id="zoomOut"
          title="Uzaklaştır"
          type="button"
        >
          −
        </button>

        <button
          class="control-button"
          id="zoomIn"
          title="Yakınlaştır"
          type="button"
        >
          +
        </button>

        <button
          class="control-button"
          id="fullscreen"
          title="Tam ekran"
          type="button"
        >
          ⛶
        </button>

      </div>

    </div>

  </header>


  <!-- VIEWER -->

  <main
    id="viewer"
    class="spread"
  >

    <div class="loading">

      <div class="loading-title">
        DEJAVU
      </div>

      <div class="loading-text">
        Dergi yükleniyor...
      </div>

    </div>

  </main>


  <!-- NAVIGATION -->

  <div class="page-navigation">

    <button
      class="nav-arrow"
      id="previous"
      type="button"
      aria-label="Önceki sayfa"
    >
      ←
    </button>

    <div
      class="page-counter"
      id="counter"
    >
      1 / 1
    </div>

    <button
      class="nav-arrow"
      id="next"
      type="button"
      aria-label="Sonraki sayfa"
    >
      →
    </button>

  </div>


  <!-- PDF.JS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* ---------------------------------
       PDF URL
    --------------------------------- */

    const params =
      new URLSearchParams(window.location.search);

    const pdfUrl =
      params.get("pdf") || "dergi/02-ekim.pdf";


    /* ---------------------------------
       ISSUE NAME
    --------------------------------- */

    const issueName =
      document.getElementById("issueName");


    function getIssueName(pdfPath) {

      const fileName =
        pdfPath
          .split("/")
          .pop()
          .replace(".pdf", "");

      const issueMap = {

        "01-eylul":
          "01 EYLÜL",

        "02-ekim":
          "02 EKİM",

        "03-kasim":
          "03 KASIM",

        "04-aralik":
          "04 ARALIK",

        "05-ocak":
          "05 OCAK",

        "06-subat":
          "06 ŞUBAT",

        "07-mart":
          "07 MART",

        "08-nisan":
          "08 NİSAN",

        "09-mayis":
          "09 MAYIS",

        "10-haziran":
          "10 HAZİRAN",

        "11-temmuz":
          "11 TEMMUZ",

        "12-agustos":
          "12 AĞUSTOS"

      };

      return issueMap[fileName] || "DEJAVU";

    }


    issueName.textContent =
      getIssueName(pdfUrl);


    /* ---------------------------------
       ELEMENTS
    --------------------------------- */

    const viewer =
      document.getElementById("viewer");

    const counter =
      document.getElementById("counter");

    const previous =
      document.getElementById("previous");

    const next =
      document.getElementById("next");

    const spreadButton =
      document.getElementById("spreadButton");

    const stripButton =
      document.getElementById("stripButton");

    const zoomInButton =
      document.getElementById("zoomIn");

    const zoomOutButton =
      document.getElementById("zoomOut");

    const fullscreenButton =
      document.getElementById("fullscreen");


    /* ---------------------------------
       STATE
    --------------------------------- */

    let pdf = null;

    let totalPages = 0;

    let currentPage = 1;

    let mode = "spread";

    let zoom = 1;


    /* ---------------------------------
       LOAD PDF
    --------------------------------- */

    async function loadPDF() {

      try {

        const loadingTask =
          pdfjsLib.getDocument(pdfUrl);

        pdf =
          await loadingTask.promise;

        totalPages =
          pdf.numPages;

        viewer.innerHTML = "";

        await renderAllPages();

        updateVisiblePages();

        updateCounter();

      }

      catch (error) {

        console.error(error);

        viewer.innerHTML = `

          <div class="error">

            <h2>
              Dergi yüklenemedi.
            </h2>

            <p>
              PDF dosyası bulunamadı veya yüklenemedi.
              <br><br>
              Kontrol edilmesi gereken dosya:
              <br>
              <strong>${pdfUrl}</strong>
            </p>

          </div>

        `;

      }

    }


    /* ---------------------------------
       RENDER ALL
    --------------------------------- */

    async function renderAllPages() {

      const fragment =
        document.createDocumentFragment();


      for (
        let pageNumber = 1;
        pageNumber <= totalPages;
        pageNumber++
      ) {

        const pageElement =
          document.createElement("div");

        pageElement.className = "page";

        pageElement.dataset.page =
          pageNumber;


        const canvas =
          document.createElement("canvas");

        pageElement.appendChild(canvas);

        fragment.appendChild(pageElement);

      }


      viewer.appendChild(fragment);


      const pages =
        [...viewer.querySelectorAll(".page")];


      for (
        const pageElement of pages
      ) {

        const pageNumber =
          Number(pageElement.dataset.page);

        await renderPage(
          pageNumber,
          pageElement
        );

      }

    }


    /* ---------------------------------
       RENDER PAGE
    --------------------------------- */

    async function renderPage(
      pageNumber,
      pageElement
    ) {

      const page =
        await pdf.getPage(pageNumber);

      const canvas =
        pageElement.querySelector("canvas");

      const context =
        canvas.getContext("2d");


      let baseScale;


      if (mode === "spread") {

        if (window.innerWidth <= 700) {

          baseScale =
            (window.innerWidth - 35) /
            page.getViewport({ scale: 1 }).width;

        }

        else {

          baseScale =
            Math.min(
              (window.innerWidth - 100) /
                2 /
                page.getViewport({ scale: 1 }).width,
              1.5
            );

        }

      }

      else {

        baseScale =
          Math.min(
            (window.innerWidth - 50) /
              page.getViewport({ scale: 1 }).width,
            1.7
          );

      }


      const scale =
        baseScale * zoom;


      const viewport =
        page.getViewport({
          scale
        });


      const ratio =
        window.devicePixelRatio || 1;


      canvas.width =
        viewport.width * ratio;

      canvas.height =
        viewport.height * ratio;


      canvas.style.width =
        `${viewport.width}px`;

      canvas.style.height =
        `${viewport.height}px`;


      context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );


      await page.render({

        canvasContext: context,

        viewport

      }).promise;

    }


    /* ---------------------------------
       VISIBLE PAGES
    --------------------------------- */

    function updateVisiblePages() {

      const pages =
        [...viewer.querySelectorAll(".page")];


      if (mode === "strip") {

        pages.forEach(page => {

          page.classList.add("visible");

          page.style.display = "";

        });

        return;

      }


      pages.forEach(page => {

        page.classList.remove("visible");

        page.style.display = "none";

      });


      const firstPage =
        currentPage % 2 === 0
          ? currentPage
          : currentPage;


      const first =
        pages[firstPage - 1];


      const second =
        pages[firstPage];


      if (first) {

        first.classList.add("visible");

        first.style.display = "";

      }


      if (second) {

        second.classList.add("visible");

        second.style.display = "";

      }

    }


    /* ---------------------------------
       COUNTER
    --------------------------------- */

    function updateCounter() {

      if (!totalPages) return;

      counter.textContent =
        `${currentPage} / ${totalPages}`;

    }


    /* ---------------------------------
       PREVIOUS
    --------------------------------- */

    function previousPage() {

      if (currentPage <= 1) return;

      currentPage -=
        mode === "spread" ? 2 : 1;

      if (currentPage < 1) {
        currentPage = 1;
      }

      updateVisiblePages();

      updateCounter();

      scrollToPage(currentPage);

    }


    /* ---------------------------------
       NEXT
    --------------------------------- */

    function nextPage() {

      if (currentPage >= totalPages) return;

      currentPage +=
        mode === "spread" ? 2 : 1;

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      updateVisiblePages();

      updateCounter();

      scrollToPage(currentPage);

    }


    /* ---------------------------------
       SCROLL TO PAGE
    --------------------------------- */

    function scrollToPage(pageNumber) {

      const page =
        viewer.querySelector(
          `.page[data-page="${pageNumber}"]`
        );

      if (!page) return;


      if (mode === "strip") {

        page.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

      }

      else {

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }


    /* ---------------------------------
       MODE
    --------------------------------- */

    async function setMode(newMode) {

      mode =
        newMode;

      viewer.className =
        mode;


      spreadButton.classList.toggle(
        "active",
        mode === "spread"
      );


      stripButton.classList.toggle(
        "active",
        mode === "strip"
      );


      await rerender();

      updateVisiblePages();

      updateCounter();

    }


    /* ---------------------------------
       ZOOM
    --------------------------------- */

    async function rerender() {

      const pages =
        [...viewer.querySelectorAll(".page")];


      for (
        const pageElement of pages
      ) {

        const pageNumber =
          Number(pageElement.dataset.page);

        await renderPage(
          pageNumber,
          pageElement
        );

      }

    }


    async function zoomIn() {

      zoom =
        Math.min(
          zoom + 0.15,
          2.5
        );

      await rerender();

      updateVisiblePages();

    }


    async function zoomOut() {

      zoom =
        Math.max(
          zoom - 0.15,
          0.5
        );

      await rerender();

      updateVisiblePages();

    }


    /* ---------------------------------
       FULLSCREEN
    --------------------------------- */

    function fullScreen() {

      if (!document.fullscreenElement) {

        document.documentElement
          .requestFullscreen()
          .catch(() => {});

      }

      else {

        document.exitFullscreen();

      }

    }


    /* ---------------------------------
       EVENTS
    --------------------------------- */

    previous.addEventListener(
      "click",
      previousPage
    );


    next.addEventListener(
      "click",
      nextPage
    );


    spreadButton.addEventListener(
      "click",
      () => setMode("spread")
    );


    stripButton.addEventListener(
      "click",
      () => setMode("strip")
    );


    zoomInButton.addEventListener(
      "click",
      zoomIn
    );


    zoomOutButton.addEventListener(
      "click",
      zoomOut
    );


    fullscreenButton.addEventListener(
      "click",
      fullScreen
    );


    /* ---------------------------------
       KEYBOARD
    --------------------------------- */

    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "ArrowLeft") {
          previousPage();
        }

        if (event.key === "ArrowRight") {
          nextPage();
        }

        if (event.key === "+") {
          zoomIn();
        }

        if (event.key === "-") {
          zoomOut();
        }

      }
    );


    /* ---------------------------------
       RESIZE
    --------------------------------- */

    let resizeTimer;

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(resizeTimer);

        resizeTimer =
          setTimeout(async () => {

            await rerender();

            updateVisiblePages();

          }, 250);

      }
    );


    /* ---------------------------------
       START
    --------------------------------- */

    loadPDF();

  </script>

</body>
</html>
