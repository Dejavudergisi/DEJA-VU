<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEJAVU — Dergi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #f2e6e1;
  --panel: #fffaf7;
  --wine: #482634;
  --pink: #d96f88;
  --soft-pink: #eaa2b1;
  --line: rgba(72,38,52,.12);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "DM Sans", sans-serif;
  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(234,162,177,.30),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(185,165,216,.28),
      transparent 30%
    ),
    var(--bg);
  color: var(--wine);
  min-height: 100vh;
  overflow-x: hidden;
}

/* HEADER */

.reader-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 72px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,250,247,.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}

.reader-brand {
  display: flex;
  align-items: center;
  gap: 18px;
}

.reader-logo {
  width: 95px;
  max-height: 45px;
  object-fit: contain;
  mix-blend-mode: multiply;
}

.issue-name {
  padding-left: 18px;
  border-left: 1px solid var(--line);
  font-family: "Cormorant Garamond", serif;
  font-size: 20px;
}

.reader-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

button {
  font-family: "DM Sans", sans-serif;
  cursor: pointer;
}

.tool-button {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.65);
  color: var(--wine);
  padding: 9px 13px;
  border-radius: 100px;
  font-size: 11px;
  transition: .25s;
}

.tool-button:hover {
  background: var(--soft-pink);
}

.tool-button.active {
  background: var(--wine);
  color: white;
  border-color: var(--wine);
}

/* NAVIGATION */

.page-navigation {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: rgba(255,250,247,.60);
  border-bottom: 1px solid var(--line);
}

.arrow {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: white;
  color: var(--wine);
  font-size: 18px;
  transition: .25s;
}

.arrow:hover {
  background: var(--wine);
  color: white;
}

#pageCounter {
  min-width: 110px;
  text-align: center;
  font-size: 12px;
  letter-spacing: .08em;
}

/* VIEWER */

#viewer {
  width: 100%;
  min-height: calc(100vh - 137px);
  padding: 45px 25px 100px;
}

/* SPREAD */

#viewer.spread {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 0;
}

#viewer.spread .page {
  width: min(45vw, 680px);
}

/* KAPAK TEK */

#viewer.spread.cover-mode .page {
  width: min(70vw, 700px);
}

/* STRIP */

#viewer.strip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 35px;
}

#viewer.strip .page {
  width: min(900px, 95vw);
}

/* PAGE */

.page {
  position: relative;
  background: white;
  box-shadow: 0 20px 50px rgba(72,38,52,.13);
  overflow: hidden;
}

.page canvas {
  display: block;
  width: 100%;
  height: auto;
}

/* YÜKLENİYOR */

#loading {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  background: #f2e6e1;
  transition: opacity .4s;
}

.loading-logo {
  font-family: "Cormorant Garamond", serif;
  font-size: 48px;
  color: var(--wine);
  font-style: italic;
}

.loader {
  width: 45px;
  height: 45px;
  border: 2px solid rgba(72,38,52,.12);
  border-top-color: var(--pink);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* MOBİL */

@media(max-width:700px) {

  .reader-header {
    padding: 0 12px;
    height: 64px;
  }

  .reader-logo {
    width: 75px;
  }

  .issue-name {
    font-size: 16px;
    padding-left: 10px;
  }

  .reader-tools {
    gap: 4px;
  }

  .tool-button {
    padding: 8px 9px;
    font-size: 9px;
  }

  .tool-button.zoom {
    display: none;
  }

  .page-navigation {
    height: 58px;
  }

  #viewer {
    padding: 20px 6px 70px;
  }

  /* TELEFONDA YAN YANA */

  #viewer.spread {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 0;
  }

  #viewer.spread .page {
    width: 50%;
    max-width: none;
  }

  /* KAPAK */

  #viewer.spread.cover-mode .page {
    width: 92%;
  }

  /* ŞERİT */

  #viewer.strip {
    gap: 20px;
  }

  #viewer.strip .page {
    width: 100%;
  }

}

/* ÇOK KÜÇÜK TELEFON */

@media(max-width:400px) {

  #viewer.spread .page {
    width: 50%;
  }

}

</style>

</head>

<body>

<!-- LOADING -->

<div id="loading">

  <div class="loading-logo">
    DEJAVU
  </div>

  <div class="loader"></div>

  <div style="
    font-size:11px;
    letter-spacing:.12em;
    color:#765d67;
  ">
    DERGİ HAZIRLANIYOR
  </div>

</div>


<!-- HEADER -->

<header class="reader-header">

  <div class="reader-brand">

    <a href="index.html">

      <img
        src="logo.jpg"
        class="reader-logo"
        alt="DEJAVU"
      >

    </a>

    <div class="issue-name">
      01 EYLÜL
    </div>

  </div>


  <div class="reader-tools">

    <button
      class="tool-button active"
      id="spreadButton"
      onclick="setMode('spread')"
    >
      YAN YANA
    </button>

    <button
      class="tool-button"
      id="stripButton"
      onclick="setMode('strip')"
    >
      ŞERİT
    </button>

    <button
      class="tool-button zoom"
      onclick="zoomOut()"
    >
      −
    </button>

    <button
      class="tool-button zoom"
      onclick="zoomIn()"
    >
      +
    </button>

    <button
      class="tool-button"
      onclick="fullScreen()"
    >
      ⛶
    </button>

  </div>

</header>


<!-- NAVIGATION -->

<div class="page-navigation">

  <button
    class="arrow"
    onclick="previousPage()"
  >
    ←
  </button>

  <div id="pageCounter">
    1 / ...
  </div>

  <button
    class="arrow"
    onclick="nextPage()"
  >
    →
  </button>

</div>


<!-- PDF -->

<main
  id="viewer"
  class="spread"
></main>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const pdfUrl =
  params.get("pdf")
  || "dergi/01-eylul.pdf";


pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdf = null;

let currentPage = 1;

let totalPages = 0;

let mode = "spread";

let zoom = 1;


const viewer =
  document.getElementById("viewer");

const counter =
  document.getElementById("pageCounter");


/* PDF YÜKLE */

async function loadPDF() {

  try {

    pdf =
      await pdfjsLib
        .getDocument(pdfUrl)
        .promise;

    totalPages =
      pdf.numPages;

    await renderAllPages();

    updateVisiblePages();

    updateCounter();

    document
      .getElementById("loading")
      .style.opacity = "0";

    setTimeout(() => {

      document
        .getElementById("loading")
        .style.display = "none";

    }, 400);

  }

  catch(error) {

    console.error(error);

    document
      .getElementById("loading")
      .innerHTML = `

        <div style="
          text-align:center;
          padding:30px;
        ">

          <div style="
            font-family:'Cormorant Garamond';
            font-size:40px;
            margin-bottom:15px;
          ">
            Bir sorun oluştu.
          </div>

          <div style="
            font-size:13px;
            color:#765d67;
          ">
            Dergi dosyası bulunamadı.
            <br><br>
            PDF dosyasının
            <b>dergi/01-eylul.pdf</b>
            konumunda olduğundan emin ol.
          </div>

        </div>
      `;

  }

}


/* SAYFALARI OLUŞTUR */

async function renderAllPages() {

  viewer.innerHTML = "";

  for (
    let i = 1;
    i <= totalPages;
    i++
  ) {

    const pageBox =
      document.createElement("div");

    pageBox.className = "page";

    pageBox.dataset.page = i;

    const canvas =
      document.createElement("canvas");

    pageBox.appendChild(canvas);

    viewer.appendChild(pageBox);

    await renderPage(
      i,
      canvas
    );

  }

}


/* SAYFA RENDER */

async function renderPage(
  pageNumber,
  canvas
) {

  const page =
    await pdf.getPage(pageNumber);

  const baseViewport =
    page.getViewport({
      scale: 1
    });


  let targetWidth;


  if (mode === "strip") {

    targetWidth =
      Math.min(
        window.innerWidth * .95,
        900
      );

  }

  else {

    if (
      currentPage === 1 &&
      pageNumber === 1
    ) {

      targetWidth =
        Math.min(
          window.innerWidth * .70,
          700
        );

    }

    else {

      targetWidth =
        Math.min(
          window.innerWidth * .45,
          680
        );

    }

  }


  targetWidth *= zoom;


  const scale =
    targetWidth /
    baseViewport.width;


  const viewport =
    page.getViewport({
      scale
    });


  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    Math.floor(
      viewport.width * ratio
    );

  canvas.height =
    Math.floor(
      viewport.height * ratio
    );


  canvas.style.width =
    "100%";

  canvas.style.height =
    "auto";


  const context =
    canvas.getContext("2d");


  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  await page.render({

    canvasContext:
      context,

    viewport:
      viewport

  }).promise;

}


/* GÖRÜNEN SAYFALAR */

function updateVisiblePages() {

  const pages =
    document.querySelectorAll(
      ".page"
    );


  pages.forEach(page => {

    page.style.display = "none";

  });


  /* ŞERİT */

  if (mode === "strip") {

    pages.forEach(page => {

      page.style.display = "block";

    });

    viewer.classList.remove(
      "cover-mode"
    );

    return;

  }


  /* KAPAK */

  if (currentPage === 1) {

    viewer.classList.add(
      "cover-mode"
    );

    const cover =
      document.querySelector(
        '[data-page="1"]'
      );

    if (cover) {

      cover.style.display =
        "block";

    }

    return;

  }


  viewer.classList.remove(
    "cover-mode"
  );


  /* İÇ SAYFALAR */

  const first =
    document.querySelector(
      `[data-page="${currentPage}"]`
    );

  const second =
    document.querySelector(
      `[data-page="${currentPage + 1}"]`
    );


  if (first) {

    first.style.display =
      "block";

  }


  if (second) {

    second.style.display =
      "block";

  }

}


/* ÖNCEKİ */

function previousPage() {

  if (mode === "strip") {

    if (currentPage > 1) {

      currentPage--;

      updateCounter();

      scrollToPage(currentPage);

    }

    return;

  }


  if (currentPage === 1) {

    return;

  }


  if (currentPage === 2) {

    currentPage = 1;

  }

  else {

    currentPage -= 2;

  }


  updateVisiblePages();

  updateCounter();

}


/* SONRAKİ */

function nextPage() {

  if (mode === "strip") {

    if (currentPage < totalPages) {

      currentPage++;

      updateCounter();

      scrollToPage(currentPage);

    }

    return;

  }


  if (currentPage === 1) {

    currentPage = 2;

  }

  else {

    currentPage += 2;

  }


  if (currentPage > totalPages) {

    currentPage = totalPages;

  }


  updateVisiblePages();

  updateCounter();

}


/* COUNTER */

function updateCounter() {

  if (!totalPages) {

    counter.textContent =
      "1 / ...";

    return;

  }


  if (mode === "strip") {

    counter.textContent =
      `${currentPage} / ${totalPages}`;

    return;

  }


  if (currentPage === 1) {

    counter.textContent =
      `Kapak / ${totalPages}`;

    return;

  }


  const second =
    Math.min(
      currentPage + 1,
      totalPages
    );


  counter.textContent =
    `${currentPage}–${second} / ${totalPages}`;

}


/* ŞERİT */

function scrollToPage(
  pageNumber
) {

  const page =
    document.querySelector(
      `[data-page="${pageNumber}"]`
    );

  if (page) {

    page.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }

}


/* MOD DEĞİŞTİR */

function setMode(newMode) {

  mode =
    newMode;


  viewer.className =
    newMode;


  document
    .getElementById("spreadButton")
    .classList
    .toggle(
      "active",
      newMode === "spread"
    );


  document
    .getElementById("stripButton")
    .classList
    .toggle(
      "active",
      newMode === "strip"
    );


  updateVisiblePages();

  updateCounter();

  rerender();

}


/* ZOOM */

function zoomIn() {

  zoom =
    Math.min(
      zoom + .1,
      1.5
    );

  rerender();

}


function zoomOut() {

  zoom =
    Math.max(
      zoom - .1,
      .7
    );

  rerender();

}


/* YENİDEN RENDER */

async function rerender() {

  if (!pdf) {

    return;

  }


  const canvases =
    document.querySelectorAll(
      ".page canvas"
    );


  for (
    let i = 0;
    i < canvases.length;
    i++
  ) {

    await renderPage(
      i + 1,
      canvases[i]
    );

  }


  updateVisiblePages();

}


/* FULLSCREEN */

function fullScreen() {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen();

  }

  else {

    document.exitFullscreen();

  }

}


/* KLAVYE */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "ArrowLeft"
    ) {

      previousPage();

    }

    if (
      event.key === "ArrowRight"
    ) {

      nextPage();

    }

  }
);


/* EKRAN BOYUTU */

window.addEventListener(
  "resize",
  () => {

    rerender();

  }
);


/* BAŞLAT */

loadPDF();

</script>

</body>
</html>
